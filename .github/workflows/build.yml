name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Lembretes.apk
      - uses: actions/upload-artifact@v5
        with:
          name: lembretes-apk
          path: Lembretes.apk
      # Publica (ou atualiza) a release "latest" com o APK para baixar direto no celular
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lembretes.apk \
            --title "Lembretes (build ${{ github.run_number }})" \
            --notes "APK gerado a partir de ${{ github.sha }} na branch ${{ github.ref_name }}." \
            --target ${{ github.sha }}
